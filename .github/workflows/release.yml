name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.0.1"
        required: true

permissions:
  contents: write

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish APKs
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug -Pswiftformat.abiSplits=true

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-artifacts
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            apk="app/build/outputs/apk/debug/app-${abi}-debug.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::APK for ${abi} was not found at ${apk}."
              exit 1
            fi
            cp "$apk" "release-artifacts/swiftformat-${abi}.apk"
          done
          sha256sum release-artifacts/* > release-artifacts/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swiftformat-${{ env.RELEASE_TAG }}
          path: release-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: 转个格式 ${{ env.RELEASE_TAG }}
          prerelease: false
          generate_release_notes: true
          body: |
            这是用于测试和体验的安装包，不需要发布签名密钥。

            下载建议：
            - 大多数安卓手机请选择 `swiftformat-arm64-v8a.apk`。
            - 老旧 32 位安卓设备请选择 `swiftformat-armeabi-v7a.apk`。
            - 模拟器再按需选择 `x86` 或 `x86_64`。
          files: |
            release-artifacts/swiftformat-arm64-v8a.apk
            release-artifacts/swiftformat-armeabi-v7a.apk
            release-artifacts/swiftformat-x86.apk
            release-artifacts/swiftformat-x86_64.apk
            release-artifacts/SHA256SUMS.txt
