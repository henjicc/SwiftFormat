name: Android Debug Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: android-debug-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish debug APK
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not found."
            exit 1
          fi

          mkdir -p release-artifacts
          cp "$DEBUG_APK" "release-artifacts/swiftformat-${RELEASE_TAG}-debug.apk"
          sha256sum release-artifacts/* > release-artifacts/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swiftformat-${{ env.RELEASE_TAG }}-debug
          path: release-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: 转个格式 ${{ env.RELEASE_TAG }} debug
          prerelease: true
          generate_release_notes: true
          body: |
            这是用于测试和体验的 debug 安装包，不需要发布签名密钥。

            注意：
            - debug 包适合私下分发和测试，不建议作为长期正式版本使用。
            - 后续切换到 release 签名包时，可能无法直接覆盖安装这个 debug 版本，需要先卸载。
          files: |
            release-artifacts/swiftformat-${{ env.RELEASE_TAG }}-debug.apk
            release-artifacts/SHA256SUMS.txt
