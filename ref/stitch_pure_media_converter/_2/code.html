<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Conversion Settings - FlexConvert</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "inverse-surface": "#2e3132",

                      "surface-variant": "#e1e3e4",
                      "secondary-fixed": "#d4e6e5",
                      "primary-container": "#00bfa5",
                      "surface-container-low": "#f3f4f5",
                      "on-error": "#ffffff",
                      "error-container": "#ffdad6",
                      "on-secondary": "#ffffff",

                      "tertiary-fixed": "#d7e4ec",

                      "on-primary-fixed-variant": "#005145",
                      "secondary": "#516161",
                      "on-primary-container": "#00473c",
                      "on-tertiary-fixed-variant": "#3c494f",

              "borderRadius": {

              "spacing": {

                      "sm": "8px",
                      "xl": "32px",

                      "lg": "24px"
              },
              "fontFamily": {
                      "body-lg": [

                      ],
                      "label-md": [
                              "12px",

                      "display-lg": [

          }

<style>
        .elevation-1 {
            box-shadow: 0px 1px 2px 0px rgba(0,0,0,0.3), 0px 1px 3px 1px rgba(0,0,0,0.15);
        }
        .elevation-2 {
            box-shadow: 0px 1px 2px 0px rgba(0,0,0,0.3), 0px 2px 6px 2px rgba(0,0,0,0.15);
        }
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg antialiased">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface w-full top-0 flat no shadows flex items-center justify-between px-margin-mobile py-sm w-full sticky z-50">
<button class="text-on-surface-variant p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">FlexConvert</h1>
<button class="text-on-surface-variant p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100 flex items-center justify-center invisible">
<span class="material-symbols-outlined">account_circle</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow px-margin-mobile py-md flex flex-col gap-lg pb-32">
<!-- Header Section -->
<section>
<h2 class="font-headline-md text-headline-md text-on-background mb-sm">Conversion Settings</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Configure output formats for your selected files.</p>
</section>
<!-- File List -->
<section class="flex flex-col gap-sm">
<!-- File Card 1: Image -->
<div class="bg-surface-container-lowest elevation-1 rounded-lg p-md flex flex-col gap-md transition-all duration-200">
<div class="flex items-center gap-md">
<div class="w-[48px] h-[48px] rounded-lg bg-secondary-container text-on-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined filled-icon">image</span>
</div>
<div class="flex-grow min-w-0">
<h3 class="font-body-lg text-body-lg text-on-surface truncate">vacation.jpg</h3>
<p class="font-body-md text-body-md text-on-surface-variant">3.2 MB • JPEG</p>
</div>
<button class="p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex items-center gap-sm mt-xs">
<div class="relative flex-grow">
<select class="w-full appearance-none bg-surface-container-lowest border-outline text-on-surface font-body-md text-body-md rounded-lg pl-md pr-xl py-sm focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
<option value="png">To PNG</option>
<option value="webp">To WebP</option>
<option value="gif">To GIF</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">arrow_drop_down</span>
</div>
</div>
<button class="p-2 text-secondary hover:bg-surface-container-high rounded-full transition-colors active:scale-95 shrink-0 border border-outline-variant">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
<!-- File Card 2: Video -->
<div class="bg-surface-container-lowest elevation-1 rounded-lg p-md flex flex-col gap-md transition-all duration-200">
<div class="flex items-center gap-md">
<div class="w-[48px] h-[48px] rounded-lg bg-tertiary-container text-on-tertiary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined filled-icon">movie</span>
</div>
<div class="flex-grow min-w-0">
<h3 class="font-body-lg text-body-lg text-on-surface truncate">intro_sequence_final_v2.mp4</h3>
<p class="font-body-md text-body-md text-on-surface-variant">142 MB • MP4</p>
</div>
<button class="p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex items-center gap-sm mt-xs">
<div class="relative flex-grow">
<select class="w-full appearance-none bg-surface-container-lowest border-outline text-on-surface font-body-md text-body-md rounded-lg pl-md pr-xl py-sm focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
<option value="mov">To MOV</option>
<option value="avi">To AVI</option>
<option value="webm">To WebM</option>
<option value="gif">To GIF</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">arrow_drop_down</span>
</div>
</div>
<button class="p-2 text-secondary hover:bg-surface-container-high rounded-full transition-colors active:scale-95 shrink-0 border border-outline-variant">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
<!-- File Card 3: Audio -->
<div class="bg-surface-container-lowest elevation-1 rounded-lg p-md flex flex-col gap-md transition-all duration-200">
<div class="flex items-center gap-md">
<div class="w-[48px] h-[48px] rounded-lg bg-surface-variant text-on-surface-variant flex items-center justify-center shrink-0">
<span class="material-symbols-outlined filled-icon">audio_file</span>
</div>
<div class="flex-grow min-w-0">
<h3 class="font-body-lg text-body-lg text-on-surface truncate">voiceover_take3.wav</h3>
<p class="font-body-md text-body-md text-on-surface-variant">12 MB • WAV</p>
</div>
<button class="p-2 text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex items-center gap-sm mt-xs">
<div class="relative flex-grow">
<select class="w-full appearance-none bg-surface-container-lowest border-outline text-on-surface font-body-md text-body-md rounded-lg pl-md pr-xl py-sm focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
<option value="mp3">To MP3</option>
<option value="aac">To AAC</option>
<option value="flac">To FLAC</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">arrow_drop_down</span>
</div>
</div>
<button class="p-2 text-secondary hover:bg-surface-container-high rounded-full transition-colors active:scale-95 shrink-0 border border-outline-variant">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full bg-surface-container-low pt-sm pb-margin-mobile px-margin-mobile flex gap-sm items-center justify-between z-40">
<!-- Secondary Button -->
<button class="flex-1 bg-secondary-container text-on-secondary-container font-label-md text-label-md py-3 rounded-full flex items-center justify-center gap-2 hover:bg-surface-variant active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined">add</span>
            Add More
        </button>
<!-- Primary FAB-style Button -->
<button class="flex-[2] bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full flex items-center justify-center gap-2 elevation-2 hover:bg-surface-tint active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined">start</span>
            Start Processing
        </button>
</div>
</body></html>
