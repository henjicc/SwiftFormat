<!DOCTYPE html>

                        "sm": "8px",
                        "xl": "32px",

                        "margin-mobile": "16px",

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen pb-24 font-body-lg text-body-lg">
<!-- TopAppBar -->
<header class="bg-surface w-full top-0 sticky z-40">
<div class="flex items-center justify-between px-margin-mobile py-sm w-full">
<button class="w-12 h-12 flex items-center justify-center hover:bg-surface-container-high transition-colors rounded-full active:scale-95 transition-transform duration-100 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">FlexConvert</h1>
<button class="w-12 h-12 flex items-center justify-center hover:bg-surface-container-high transition-colors rounded-full active:scale-95 transition-transform duration-100 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
<div class="px-margin-mobile pb-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface md:font-headline-lg md:text-headline-lg">Settings</h2>
</div>
</header>
<!-- Main Content Canvas -->
<main class="px-margin-mobile py-md md:px-lg max-w-2xl mx-auto space-y-2">
<!-- General Category -->
<div class="pt-sm pb-xs">
<h3 class="font-label-md text-label-md text-primary uppercase">General</h3>
</div>
<button class="w-full flex items-center justify-between py-md px-sm hover:bg-surface-container-low transition-colors rounded-lg active:bg-surface-container-high duration-150 group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 flex items-center justify-center rounded-full bg-secondary-container text-on-secondary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="folder" data-weight="fill" style="font-variation-settings: 'FILL' 1;">folder</span>
</div>
<div class="text-left">
<div class="font-body-lg text-body-lg text-on-surface">Save Location</div>
<div class="font-body-md text-body-md text-on-surface-variant">/storage/emulated/0/FlexConvert</div>
</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-on-surface transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<div class="w-full h-px bg-surface-variant my-xs"></div>
<button class="w-full flex items-center justify-between py-md px-sm hover:bg-surface-container-low transition-colors rounded-lg active:bg-surface-container-high duration-150 group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 flex items-center justify-center rounded-full bg-secondary-container text-on-secondary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="delete_sweep">delete_sweep</span>
</div>
<div class="text-left">
<div class="font-body-lg text-body-lg text-on-surface">Auto-delete original</div>
<div class="font-body-md text-body-md text-on-surface-variant">Remove source file after successful conversion</div>
</div>
</div>
<!-- MD3 Switch styling -->
<div class="w-12 h-8 rounded-full bg-surface-container-highest flex items-center p-1 relative border-2 border-outline cursor-pointer">
<div class="w-4 h-4 rounded-full bg-outline"></div>
</div>
</button>
<div class="w-full h-px bg-surface-variant my-xs"></div>
<button class="w-full flex items-center justify-between py-md px-sm hover:bg-surface-container-low transition-colors rounded-lg active:bg-surface-container-high duration-150 group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 flex items-center justify-center rounded-full bg-secondary-container text-on-secondary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</div>
<div class="text-left">
<div class="font-body-lg text-body-lg text-on-surface">Dark Mode</div>
<div class="font-body-md text-body-md text-on-surface-variant">Follow system default</div>
</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-on-surface transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Advanced Category -->
<div class="pt-lg pb-xs">
<h3 class="font-label-md text-label-md text-primary uppercase">Advanced</h3>
</div>
<button class="w-full flex items-center justify-between py-md px-sm hover:bg-surface-container-low transition-colors rounded-lg active:bg-surface-container-high duration-150 group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 flex items-center justify-center rounded-full bg-secondary-container text-on-secondary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="speed">speed</span>
</div>
<div class="text-left">
<div class="font-body-lg text-body-lg text-on-surface">Max concurrent tasks</div>
<div class="font-body-md text-body-md text-on-surface-variant">Currently set to 3</div>
</div>
</div>
<span class="font-body-lg text-body-lg text-primary group-hover:text-on-surface transition-colors">Edit</span>
</button>
<div class="w-full h-px bg-surface-variant my-xs"></div>
<button class="w-full flex items-center justify-between py-md px-sm hover:bg-surface-container-low transition-colors rounded-lg active:bg-surface-container-high duration-150 group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 flex items-center justify-center rounded-full bg-secondary-container text-on-secondary-container group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="info">info</span>
</div>
<div class="text-left">
<div class="font-body-lg text-body-lg text-on-surface">About</div>
<div class="font-body-md text-body-md text-on-surface-variant">Version 2.4.1</div>
</div>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-on-surface transition-colors" data-icon="chevron_right">chevron_right</span>
</button>

<span class="font-label-md text-label-md">Convert</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high transition-colors active:scale-90 duration-200 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="font-label-md text-label-md">Recent</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-lg py-xs hover:bg-surface-container-high transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
</nav>
